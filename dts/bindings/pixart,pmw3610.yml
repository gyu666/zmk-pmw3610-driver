description: |
  Sensor driver for the pixart PMW3610 mouse sensor 

compatible: "pixart,pmw3610"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  scroll-layers:
    type: array
    default: []
  snipe-layers:
    type: array
    default: []
  automouse-layer:
    type: int
    default: -1
  invert-x:
    type: boolean
    description: Invert X-axis movement
  invert-y:
    type: boolean
    description: Invert Y-axis movement
  scroll-layers:
    type: int
    description: Layer number for scroll mode
  automouse-layer:
    type: int
    description: Layer number for automouse mode
